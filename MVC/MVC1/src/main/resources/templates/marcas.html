<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    </head>
    <body>
        
        <div th:replace="~{navegacion :: navegacion}"></div>
        <div class="container mt-4 mb-5">

    <div class="text-center mb-4">
        <h1 class="fw-bold">REGISTRO DE MARCAS</h1>
        <p class="text-muted">
            Administración de marcas
        </p>
    </div>

        <p th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/marcas/guardar}"th:object="${marca}"method="post">

            <input class="form-control" type="hidden" th:field="*{idMarca}">

            <div class="col-md-6">

    <label class="form-label">
        Nombre
    </label>

    <input class="form-control" type="text" th:field="*{nombre}" placeholder="Ingrese el nombre">
            </div>
            <button class="btn btn-secondary" type="submit">
                Guardar
            </button>

        </form>

        <br>

        <table border="1" class="table table-striped-columns">

            <tr>
                <th>ID</th>
                <th>NOMBRE</th>
                <th>ACCIONES</th>
            </tr>

            <tr th:each="m : ${marcas}">

                <td th:text="${m.idMarca}"></td>

                <td th:text="${m.nombre}"></td>

                <td>

                    <a class="btn btn-light" th:href="@{/marcas/editar/{id}(id=${m.idMarca})}">
                        Editar
                    </a>

                    <form th:action="@{/marcas/eliminar/{id}(id=${m.idMarca})}" method="post">

                        <button class="btn btn-dark" type="submit">
                            Eliminar
                        </button>

                    </form>

                </td>

            </tr>

        </table>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    </body>
</html>
