<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    </head>
    <body>
        
        <div th:replace="~{navegacion :: navegacion}"></div>
        
         <div class="container mt-4 mb-5">
         <div class="text-center mb-4">
                <h1 class="fw-bold">REGISTRO DE EMPLEADOS</h1>
                <p class="text-muted">
                    Administración de empleados
                </p>
            </div>

        <p th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/empleados/guardar}"th:object="${empleado}" method="post">

            <input  class="form-control" type="hidden" th:field="*{idEmpleado}">

            <div class="col-md-6">

                                <label class="form-label">
                                    ID Puesto
                                </label>

                                <input class="form-control" type="text" th:field="*{idPuesto}" placeholder="Ingrese el ID del puesto">
                                </div>
                                <div class="col-md-6">
                                <label class="form-label">
                                    Nombre
                                </label>

                                <input class="form-control" type="text" th:field="*{nombre}" placeholder="Ingrese el nombre">
                                </div>

            <div class="col-md-6">

                                <label class="form-label">
                                    Apellidos
                                </label>

                                <input class="form-control" type="text" th:field="*{apellidos}" placeholder="Ingrese los apellidos">
                                </div>

                                <div class="col-md-6">
                                <label class="form-label">
                                    Fecha de Contratación
                                </label>

                                <input class="form-control" type="date" th:field="*{contratacion}">
                                </div>
            <button class="btn btn-secondary" type="submit">
                Guardar
            </button>

        </form>

        <br>

        <table border="1" class="table table-striped-columns">

            <tr>
                <th>ID</th>
                <th>ID PUESTO</th>
                <th>NOMBRE</th>
                <th>APELLIDOS</th>
                <th>FECHA DE CONTRATACION</th>
                <th>ACCIONES</th>
            </tr>

            <tr th:each="e : ${empleados}">

                <td th:text="${e.idEmpleado}"></td>

                <td th:text="${e.idPuesto}"></td>

                <td th:text="${e.nombre}"></td>

                <td th:text="${e.apellidos}"></td>

                <td th:text="${e.contratacion}"></td>

                <td>

                    <a class="btn btn-light" th:href="@{/empleados/editar/{id}(id=${e.idEmpleado})}">
                        Editar
                    </a>

                    <form th:action="@{/empleados/eliminar/{id}(id=${e.idEmpleado})}" method="post">

                        <button class="btn btn-dark" type="submit">
                            Eliminar
                        </button>

                    </form>

                </td>

            </tr>

        </table>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    </body>
</html>
